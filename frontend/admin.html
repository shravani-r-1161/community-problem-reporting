
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityConnect | Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f5fa;
            color: #263247;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000012;
        }

        h1, h2 {
            margin-bottom: 15px;
        }

        .login-box p {
            margin-bottom: 20px;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccd3df;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2457c5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-box button {
            width: 100%;
            margin-top: 10px;
        }

        #dashboard {
            display: none;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header button {
            background: #e04b4b;
        }

        main {
            padding: 30px 5%;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 25px 0;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000008;
        }

        .stat-card h2 {
            font-size: 30px;
            margin-top: 10px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .filters input, .filters select {
            width: auto;
            min-width: 180px;
            padding: 11px;
            border: 1px solid #ccd3df;
            border-radius: 6px;
        }

        .complaint-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .complaint-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000008;
        }

        .complaint-card h3 {
            margin-bottom: 12px;
        }

        .complaint-card p {
            margin: 9px 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .complaint-card img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 7px;
        }

        .complaint-card select {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid #ccd3df;
            border-radius: 6px;
        }

        .complaint-card .update-btn {
            width: 100%;
        }

        .message {
            text-align: center;
            margin: 15px 0;
            color: #b42318;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 750px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ADMIN LOGIN -->
    <section class="login-box" id="loginBox">
        <h1>CommunityConnect</h1>
        <h2>Admin Login</h2>
        <p>Sign in using your administrator account.</p>

        <form id="adminLoginForm">
            <input
                type="email"
                id="email"
                placeholder="Admin email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Admin password"
                required
            >

            <button type="submit">Login as Admin</button>
        </form>

        <p class="message" id="loginMessage"></p>
    </section>

    <!-- ADMIN DASHBOARD -->
    <section id="dashboard">

        <header>
            <div>
                <h1>CommunityConnect Admin</h1>
                <p id="welcomeAdmin"></p>
            </div>

            <button onclick="logoutAdmin()">Logout</button>
        </header>

        <main>
            <h2>Dashboard Overview</h2>
            <p>Monitor and manage community complaints.</p>

            <div class="stats">
                <div class="stat-card">
                    <p>Total Complaints</p>
                    <h2 id="totalCount">0</h2>
                </div>

                <div class="stat-card">
                    <p>Pending</p>
                    <h2 id="pendingCount">0</h2>
                </div>

                <div class="stat-card">
                    <p>In Progress</p>
                    <h2 id="progressCount">0</h2>
                </div>

                <div class="stat-card">
                    <p>Resolved</p>
                    <h2 id="resolvedCount">0</h2>
                </div>
            </div>

            <h2>All Complaints</h2>

            <div class="filters">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search title or location"
                >

                <select id="statusFilter">
                    <option value="All">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

                <select id="categoryFilter">
                    <option value="All">All Categories</option>
                </select>

                <button onclick="loadComplaints()">Refresh</button>
            </div>

            <div class="complaint-list" id="complaintList"></div>
        </main>
    </section>

    <script>
        const API_URL = "http://127.0.0.1:5000/api";

        let admin = null;
        let allComplaints = [];

        document.getElementById("adminLoginForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const message = document.getElementById("loginMessage");
                message.textContent = "Checking login...";

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document.getElementById("email").value,
                            password: document.getElementById("password").value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || "Login failed");
                    }

                    if (data.user.role !== "admin") {
                        throw new Error("Access denied. Admin account required.");
                    }

                    admin = data.user;

                    document.getElementById("loginBox").style.display = "none";
                    document.getElementById("dashboard").style.display = "block";
                    document.getElementById("welcomeAdmin").textContent =
                        "Welcome, " + admin.name;

                    await loadComplaints();

                } catch (error) {
                    message.textContent = error.message;
                }
            });

        async function loadComplaints() {
            const list = document.getElementById("complaintList");
            list.innerHTML = "<p>Loading complaints...</p>";

            try {
                const response = await fetch(
                    `${API_URL}/admin/complaints?admin_id=${admin.id}`
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Unable to load complaints");
                }

                allComplaints = data;

                updateStatistics();
                populateCategories();
                displayComplaints();

            } catch (error) {
                list.innerHTML =
                    `<p class="message">${escapeHTML(error.message)}</p>`;
            }
        }

        function updateStatistics() {
            document.getElementById("totalCount").textContent =
                allComplaints.length;

            document.getElementById("pendingCount").textContent =
                allComplaints.filter(c => c.status === "Pending").length;

            document.getElementById("progressCount").textContent =
                allComplaints.filter(c => c.status === "In Progress").length;

            document.getElementById("resolvedCount").textContent =
                allComplaints.filter(c => c.status === "Resolved").length;
        }

        function populateCategories() {
            const categorySelect =
                document.getElementById("categoryFilter");

            const selected = categorySelect.value;

            const categories = [
                ...new Set(allComplaints.map(c => c.category))
            ];

            categorySelect.innerHTML =
                '<option value="All">All Categories</option>';

            categories.forEach(category => {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });

            categorySelect.value = categories.includes(selected)
                ? selected
                : "All";
        }

        function displayComplaints() {
            const list = document.getElementById("complaintList");
            const search = document.getElementById("searchInput")
                .value.toLowerCase();

            const status = document.getElementById("statusFilter").value;
            const category = document.getElementById("categoryFilter").value;

            const filtered = allComplaints.filter(c => {
                const matchesSearch =
                    (c.title || "").toLowerCase().includes(search) ||
                    (c.location || "").toLowerCase().includes(search);

                const matchesStatus =
                    status === "All" || c.status === status;

                const matchesCategory =
                    category === "All" || c.category === category;

                return matchesSearch && matchesStatus && matchesCategory;
            });

            if (filtered.length === 0) {
                list.innerHTML =
                    '<p class="empty">No complaints found.</p>';
                return;
            }

            list.innerHTML = "";

            filtered.forEach(c => {
                const card = document.createElement("article");
                card.className = "complaint-card";

                card.innerHTML = `
                    <h3>${escapeHTML(c.title)}</h3>
                    <p><strong>ID:</strong> ${escapeHTML(c.complaint_id)}</p>
                    <p><strong>Category:</strong> ${escapeHTML(c.category)}</p>
                    <p><strong>Description:</strong> ${escapeHTML(c.description)}</p>
                    <p><strong>Location:</strong> ${escapeHTML(c.location)}</p>
                    <p><strong>Reported by:</strong> ${escapeHTML(c.user_name)}</p>
                    <p><strong>Date:</strong> ${escapeHTML(c.created_at)}</p>
                    <p><strong>Current status:</strong> ${escapeHTML(c.status)}</p>

                    ${c.image ? `<img src="${c.image}" alt="Complaint image">` : ""}

                    <label>Update status:</label>

                    <select class="status-choice">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>

                    <button class="update-btn">Update Status</button>
                `;

                const select = card.querySelector(".status-choice");
                select.value = c.status;

                card.querySelector(".update-btn").addEventListener(
                    "click",
                    () => updateStatus(c.complaint_id, select.value)
                );

                list.appendChild(card);
            });
        }

        async function updateStatus(complaintId, newStatus) {
            try {
                const response = await fetch(
                    `${API_URL}/admin/complaints/${encodeURIComponent(complaintId)}/status`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            admin_id: admin.id,
                            status: newStatus
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Status update failed");
                }

                alert("Complaint status updated successfully!");
                await loadComplaints();

            } catch (error) {
                alert(error.message);
            }
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        document.getElementById("searchInput")
            .addEventListener("input", displayComplaints);

        document.getElementById("statusFilter")
            .addEventListener("change", displayComplaints);

        document.getElementById("categoryFilter")
            .addEventListener("change", displayComplaints);

        function logoutAdmin() {
            admin = null;
            allComplaints = [];

            document.getElementById("dashboard").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
            document.getElementById("adminLoginForm").reset();
            document.getElementById("loginMessage").textContent = "";
        }
    </script>

</body>
</html>
